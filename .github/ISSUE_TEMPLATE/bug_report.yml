name: Bug report
description: Report a reproducible problem in BubblePlug
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, remove Live Set names, personal file paths, account details, credentials and unrelated desktop content from screenshots and logs. Never post access tokens.
  - type: input
    id: app-version
    attributes:
      label: BubblePlug version or commit
      placeholder: "0.1.0 or a short commit hash"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.x"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Unknown
    validations:
      required: true
  - type: input
    id: live-version
    attributes:
      label: Ableton Live version
      placeholder: "e.g. Live 12.4.2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Number the steps and include what you expected and what happened.
      placeholder: |
        1. Open Live...
        2. Open BubblePlug...
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or sanitized log (optional)
      description: Attach only if it helps reproduce the issue. Redact private paths and project information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths and private project details from this report.
          required: true
