name: Feature request
description: Suggest an improvement to BubblePlug
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the production workflow or friction point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like BubblePlug to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, credentials and private project details from this request.
          required: true
